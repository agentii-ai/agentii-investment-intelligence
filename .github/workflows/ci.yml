name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest

      - name: check.py (manifest lint + skill structure)
        run: python3 scripts/check.py

      - name: validate-citations.py (FR-050)
        run: python3 scripts/validate-citations.py

      - name: validate-mode-syntax.py (FR-052b)
        run: python3 scripts/validate-mode-syntax.py

      - name: validate-prose-safety.py (FR-020e)
        run: python3 scripts/validate-prose-safety.py

      - name: validate-multi-ticker-syntax.py (FR-054b)
        run: python3 scripts/validate-multi-ticker-syntax.py

      - name: validate-telemetry-redaction.py (FR-053b)
        run: python3 scripts/validate-telemetry-redaction.py

      - name: validate-partner-plugin.py (FR-048, FR-049)
        run: python3 scripts/validate-partner-plugin.py

      - name: check_disclaimer.py (Q139 placement + single-source)
        # WAS NOT RUN BY CI. Q139 named this script as the disclaimer's
        # enforcement point and the script was correct — it compares
        # dashboard.html's footer against the single source, prints the
        # placement-table coverage, and exits 1 on drift — but nothing invoked
        # it. It appeared in no test module and in no step of this file.
        #
        # That is Q142's defect exactly, one level up: a gate that names its
        # location and never fires there. The spec's own header records the
        # class ("a declared mechanism that silently returns empty success") and
        # this was an instance of it *inside the mechanism written to end it*.
        #
        # It is placed with the other validators rather than after `pytest`
        # because pytest does not cover it: the file lives in scripts/, and the
        # suite never imported it.
        run: python3 scripts/check_disclaimer.py

      - name: test-cookbooks.sh (FR-046b cookbook lint; Phase-1 tolerant)
        # Phase 1 tolerance: skips cookbooks without agent.yaml. Phase 7 (US7)
        # populates cookbooks and removes the skip. Per phase1-analyze.md F3.
        run: bash scripts/test-cookbooks.sh

      - name: pytest (full test suite)
        run: python3 -m pytest tests/ -v

      - name: quality-scan (spec 039 skill quality)
        run: python3 scripts/quality-scan.py
