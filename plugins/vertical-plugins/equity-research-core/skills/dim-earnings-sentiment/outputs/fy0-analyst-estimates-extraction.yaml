citation_density:
  format_regex: \[\ud83d\udcc4 [^\]]+ p\.\d+\]\(agentii://source/[a-f0-9-]+\?accession=[\d-]+&page=\d+\)
  metric: citations_per_200_words
  minimum: 1
dimension: 7
mode_slug: fy0-analyst-estimates-extraction
multi_ticker_semantics: single_target
required_sections:
- Executive Summary
- Analysis
- Coverage Gaps
- Citations
spec_version: '1.0'
structure_hints:
- '- **structure**: ## Current Fiscal Year (FY0) Analyst Estimates


  **Fiscal Year**: FY{year}

  **Earnings Release Date**: {date}


  **Data Sources**:

  - Morgan Stanley: {title, date}

  - Jefferies: {title, date}


  | **Key Financials** | **Mean Estimate** | **Notes / Source Commentary** |

  |:-------------------|:-----------------:|:-----------------------------|

  | Revenues | <XXXM-amount> | Avg of MS: <XXXM-amount>, Jefferies: <XXXM-amount>
  _(cite source filing in standard agentii citation format at runtime)_ |

  | EPS (Non-GAAP) | <X.XX-amount> | Avg of MS: <X.XX-amount>, Jefferies: <X.XX-amount>
  _(cite source filing in standard agentii citation format at runtime)_ |

  | EBITDA | <XXXM-amount> | {or N/A if not disclosed} |

  | **Adj. EBITDA** | <XXXM-amount> | {or N/A if not disclosed} |

  | Net Income | <XXXM-amount> | {or N/A if not disclosed} |

  | **Gross Margin** | XX.XX% | {or N/A if not disclosed} |

  | **Operating Margin** | XX.XX% | {or N/A if not disclosed} |

  | Net Margin | XX.XX% | {or N/A if not disclosed} |


  **Calculation Notes**:

  - Mean calculated as (MS estimate + Jefferies estimate) / 2

  - If only one source available, use that single estimate

  - All estimates rounded to appropriate precision

  '
validation_rules:
- section-presence
- citation-density
- trigger-coverage
