citation_density:
  format_regex: \[\ud83d\udcc4 [^\]]+ p\.\d+\]\(agentii://source/[a-f0-9-]+\?accession=[\d-]+&page=\d+\)
  metric: citations_per_200_words
  minimum: 1
dimension: 7
mode_slug: current-quarter-estimates-vs-guidance
multi_ticker_semantics: single_target
required_sections:
- Executive Summary
- Analysis
- Coverage Gaps
- Citations
spec_version: '1.0'
structure_hints:
- "- **structure**: ## Current-Quarter Estimates vs. Management Guidance\n\n**Current\
  \ Quarter**: Q{X} FY{Year}\n**Upcoming Earnings Date**: {date}\n\n**Data Sources**:\n\
  - Analyst Estimates: {MS and Jefferies previews with dates}\n- Management Guidance:\
  \ {8-K from last earnings, date}\n\n| **Key Financials** | **Analyst Estimates**\
  \ | **Management Guidance** | **Variance** | **% Var** |\n|:-------------------|:---------------------:|:-----------------------:|:------------:|:---------:|\n\
  | Revenues | <XXXM-amount> | <XXXM-amount> | +<XXM-amount> | +X.X% |\n| EPS (Non-GAAP)\
  \ | <X.XX-amount> | <X.XX-amount> | +$0.XX | +X.X% |\n| EBITDA | <XXXM-amount> |\
  \ <XXXM-amount> | -<XXM-amount> | -X.X% |\n| **Adj. EBITDA** | <XXXM-amount> | <XXXM-amount>\
  \ | $0M | 0.0% |\n| Net Income | <XXXM-amount> | <XXXM-amount> | +<XXM-amount> |\
  \ +X.X% |\n\n**Variance Analysis**:\n- {Metric with largest positive variance}:\
  \ Analysts {X}% above guidance\n  - Potential drivers: {Brief explanation} _(cite\
  \ source filing in FR-050 format at runtime)_\n- {Metric with negative variance\
  \ if any}: Analysts {X}% below guidance\n  - Potential concerns: {Brief explanation}\
  \ _(cite source filing in FR-050 format at runtime)_\n\n**Overall Assessment**:\n\
  {2-3 sentences summarizing whether analysts are generally above, in-line, or below\
  \ guidance,\nand potential implications for upcoming earnings}\n\n**Key Observations**:\n\
  - {Notable variance patterns}\n- {Consistency or inconsistency across metrics}\n\
  - {Context for variances from preview reports}\n"
- '- **variance_interpretation**:'
- '  - in_line'
- '  - material_variance'
- '  - negative_variance'
- '  - positive_variance'
validation_rules:
- section-presence
- citation-density
- trigger-coverage
