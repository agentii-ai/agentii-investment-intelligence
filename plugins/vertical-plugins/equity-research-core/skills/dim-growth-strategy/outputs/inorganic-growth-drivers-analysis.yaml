citation_density:
  format_regex: \[\ud83d\udcc4 [^\]]+ p\.\d+\]\(agentii://source/[a-f0-9-]+\?accession=[\d-]+&page=\d+\)
  metric: citations_per_200_words
  minimum: 1
dimension: 3
mode_slug: inorganic-growth-drivers-analysis
multi_ticker_semantics: single_target
required_sections:
- Executive Summary
- Analysis
- Coverage Gaps
- Citations
spec_version: '1.0'
structure_hints:
- '- **quality_standards**:'
- '  - chronological_accuracy'
- '  - citation_discipline'
- '  - impact_assessment_rigor'
- '  - presence_determination'
- '  - transaction_completeness'
- "- **structure**: ## Inorganic Growth Drivers Analysis\n\n**Analysis Period**: {Specify\
  \ 5-year period, e.g., \"FY19-FY23 plus 2024 YTD\"}\n\n**Data Sources**:\n- Annual\
  \ Filings: {List 10-K years reviewed}\n- Material Announcements: {Number of 8-Ks\
  \ reviewed}\n- Earnings Materials: {Recent earnings calls reviewed}\n\n**Inorganic\
  \ Activity Assessment**:\n\n| Dimension | Presence | Summary of Evidence | Impact\
  \ | Source(s) |\n|:----------|:---------|:-------------------|:-------|:----------|\n\
  | M&A Transactions | Yes/No/Nil | {Count and brief overview} | {Predominant impact\
  \ category} | {Citations} |\n| Equity Investments | Yes/No/Nil | {Count and brief\
  \ overview} | {Predominant impact category} | {Citations} |\n| Asset Purchases |\
  \ Yes/No/Nil | {Count and brief overview} | {Predominant impact category} | {Citations}\
  \ |\n| Divestitures | Yes/No/Nil | {Count and brief overview} | {Predominant impact\
  \ category} | {Citations} |\n| Strategic Alliances / JVs | Yes/No/Nil | {Count and\
  \ brief overview} | {Predominant impact category} | {Citations} |\n| Licensing /\
  \ Franchise Deals | Yes/No/Nil | {Count and brief overview} | {Predominant impact\
  \ category} | {Citations} |\n\n**Detailed Transaction Listings**:\n\n### {Category\
  \ Name}\n**Presence**: Yes/No/Nil\n\n{If Presence=Yes, provide chronological listing}\n\
  \n#### Transaction 1: {Acquired Company / Asset / Partner Name}\n- **Date**: {Announcement\
  \ date} | {Closing date}\n- **Transaction Type**: {Acquisition / Investment / Alliance\
  \ / etc.}\n- **Description**: {Brief description of target and strategic rationale}\n\
  - **Financial Terms**: {Purchase price, structure, ownership %}\n- **Strategic Rationale**:\
  \ {Why this transaction supports growth strategy}\n- **Impact Assessment**: Factor-in\
  \ / On-going / Unclear\n  - {Explanation of impact assessment}\n  - {Revenue contribution,\
  \ synergies, integration status}\n- **Sources**: _(cite source filing in FR-050\
  \ format at runtime)_, _(cite source filing in FR-050 format at runtime)_\n\n####\
  \ Transaction 2: {Name}\n{Repeat structure for each transaction}\n\n{Repeat for\
  \ each category with Presence=Yes}\n\n**Key Observations**:\n- {Total count of inorganic\
  \ activities across all categories}\n- {Dominant inorganic growth approach: M&A,\
  \ partnerships, etc.}\n- {Evolution of strategy over 5 years: increasing/decreasing\
  \ activity}\n- {Current vs. historical impact: how much of growth is factored in}\n"
validation_rules:
- section-presence
- citation-density
- trigger-coverage
