citation_density:
  format_regex: \[\ud83d\udcc4 [^\]]+ p\.\d+\]\(agentii://source/[a-f0-9-]+\?accession=[\d-]+&page=\d+\)
  metric: citations_per_200_words
  minimum: 1
dimension: 3
mode_slug: growth-strategy-assessment
multi_ticker_semantics: single_target
required_sections:
- Executive Summary
- Analysis
- Coverage Gaps
- Citations
spec_version: '1.0'
structure_hints:
- '- **quality_standards**:'
- '  - citations'
- '  - clarity'
- '  - conciseness'
- '  - evidence_based'
- '  - recency'
- '- **structure**: ## Growth Strategy Assessment


  **Growth Strategy Classification**: [Organic / Inorganic / Mix]


  **Strategy Summary**:

  {Concise explanation of the company''s growth approach, 3-5 sentences}


  **Supporting Evidence**:


  ### Organic Growth Indicators

  - {List identified organic initiatives with citations}

  - {Example: Product development programs mentioned in Q2 earnings call _(cite source
  filing in FR-050 format at runtime)_}


  ### Inorganic Growth Indicators

  - {List identified inorganic initiatives with citations}

  - {Example: M&A transaction announced in 8-K filing _(cite source filing in FR-050
  format at runtime)_}


  **Data Sources Analyzed**:

  - {List key documents reviewed: 10-K, earnings calls, analyst reports}


  **Temporal Scope**: {Specify analysis period, e.g., "FY23 10-K plus Q1-Q2 2024 earnings
  materials"}

  '
validation_rules:
- section-presence
- citation-density
- trigger-coverage
