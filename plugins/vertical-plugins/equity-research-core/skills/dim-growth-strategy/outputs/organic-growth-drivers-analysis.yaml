citation_density:
  format_regex: \[\ud83d\udcc4 [^\]]+ p\.\d+\]\(agentii://source/[a-f0-9-]+\?accession=[\d-]+&page=\d+\)
  metric: citations_per_200_words
  minimum: 1
dimension: 3
mode_slug: organic-growth-drivers-analysis
multi_ticker_semantics: single_target
required_sections:
- Executive Summary
- Analysis
- Coverage Gaps
- Citations
spec_version: '1.0'
structure_hints:
- '- **quality_standards**:'
- '  - citation_discipline'
- '  - evidence_requirements'
- '  - presence_determination'
- '  - temporal_accuracy'
