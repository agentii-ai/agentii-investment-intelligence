# pending.yaml — work that is deferred, each entry with an owner and an expiry.
#
# spec 058 FR-054 (T011). A deferred state has to be DECLARED, because it is otherwise
# indistinguishable from a satisfied one: an empty directory, an unpopulated table and a
# surface nobody built all read exactly like a clean result. FR-006 says a check that
# examined nothing MUST fail — which is right, but it leaves two states conflated:
#
#   * a check that is BROKEN or was never wired (must fail), and
#   * a check whose input does not exist YET (must not read as clean either).
#
# This file is the second state, made explicit. It is not an exemption list: an entry
# names a real owner and a real date, and passing that date fails the gate. A deferral
# that is never revisited is how a temporary scaffold becomes the architecture, which is
# why FR-054 mirrors the `xfail(strict=True)` discipline of FR-005.
#
# Enforced by scripts/check.py:
#   * every entry MUST carry id, subject, what, owner, expires, reason — a partial
#     declaration is a declaration that cannot be acted on
#   * `expires` MUST parse as an ISO date, and an entry PAST its date FAILS the gate
#   * `subject` MUST be consumed by something; an entry nothing reads is reported,
#     because a field that records a condition without triggering anything is the
#     same defect FR-040 names for `upstream_stale`
#
# THE SUBJECT SPACE IS `check:<number>`, AND NOTHING ELSE (2026-09-21 audit)
#
# An entry's subject must name a section in `check.py`'s surface table
# (`python3 scripts/check.py --surfaces`), which is the only deferral this gate can
# VERIFY: it can see that the section examined nothing and that the entry exists.
#
# The narrower question is why nothing else is accepted. A deferral the gate cannot
# verify would be a claim wearing a date — precisely the shape FR-040 rejects for
# `upstream_stale` ("a freshness field that every artifact carries and no process reads
# is not a control; it is a comment"). So deferrals whose consumer is elsewhere are
# declared elsewhere, and each carries a STANDING NOTICE instead of an expiry:
#
#   * T064 — the Sunset/X-API-Deprecated header contract. Its consumer is a test in
#     `agentii-ai`, so its declaration belongs to that repository, enforced by that
#     repository's gate. This file is one INSTANCE of the rule, not the rule.
#   * T124 — the user-local marketplace install. Refreshing it means publishing, which
#     is outward-facing and the owner's call.
#   * T125 / FR-040 — `upstream_stale` in the B/ workspaces. An expiry here would fail
#     THIS gate for a workspace owner's inaction, in a repository that does not contain
#     the field. It gets the treatment this file's rule prescribes instead: Check 52
#     reports the field on every run.
#
# Consumed today by: the zero-surface rule (FR-006/T002) for `check:8` — the one
# deferral in this repository that a gate can see and a date can act on.
version: 1
pending:
  - id: P1
    subject: check:8
    what: >-
      managed-agent-cookbooks are not populated, so section 8's required-file check
      runs over no cookbook at all
    owner: spec 046 US7 (managed-agent cookbook authoring)
    expires: 2026-12-31
    reason: >-
      Cookbooks are populated in Phase 7 / US7. Until then section 8 has nothing to
      validate. Before this declaration it counted the directories it WALKED (1) rather
      than the cookbooks it validates (0), which made a vacuous section read as
      productive — spec 058 U2, found by the Phase-1 analysis. This entry lets the
      section report the truth and still keep the gate green, and it expires so the
      state cannot become permanent.
