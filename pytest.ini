[pytest]
# Spec 039 test harness. CI runs the default (fixture-based, key-free) suite.
# Live smoke tests against real endpoints are opt-in via `pytest --run-live -m live`.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live: hits real external endpoints; requires API-key secrets and --run-live (deselected by default)
addopts = -ra
