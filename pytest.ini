[pytest]
# Spec 039 test harness. CI runs the default (fixture-based, key-free) suite.
# Live smoke tests against real endpoints are opt-in via `pytest --run-live -m live`.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live: hits real external endpoints; requires API-key secrets and --run-live (deselected by default)
    smoke: fast end-to-end reachability check — the tool/endpoint answers at all. Distinct from `live`: a smoke test asserts something responded, a live test asserts what it returned. Used by tests/test_mcp_live_smoke.py and tests/test_market_data_smoke.py (FR-011)
addopts = -ra
